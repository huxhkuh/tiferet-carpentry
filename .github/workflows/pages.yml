# =============================================================================
# Build Vite SPA & deploy to GitHub Pages
# =============================================================================
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy
    # 'github-pages' is the special environment name required by actions/deploy-pages.
    # GitHub auto-creates it when Pages is configured to deploy from Actions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node

      - name: Quality and regression gate
        run: npm run check

      - name: Build
        run: npm run build

      - name: Bundle and performance gate
        run: npm run bundle:check && npm run bench:check

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Browser regression gate
        run: npm run test:e2e

      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
