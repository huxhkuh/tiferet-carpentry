    <!-- Content Security Policy (v3.62.0 — Phase 12 / Sprint 16: added CSP report-to via _headers)
         Authoritative CSP lives in public/_headers (Cloudflare Pages HTTP header) and includes
         report-to + report-uri directives pointing at the companion CSP Worker endpoint.
         This <meta> tag acts as a fallback for non-CF-Pages environments (local dev, file:// preview).
         report-to / report-uri are not supported in <meta> tags and are deliberately omitted here.
         script-src: 'wasm-unsafe-eval' required for WebAssembly (cut-optimizer).
                     cloudflareinsights.com: Cloudflare Web Analytics beacon (privacy-first, no cookies).
         style-src 'unsafe-inline': Tailwind v4 injects critical CSS inline.
         worker-src blob: : Vite wraps workers in blob URLs in dev mode.
         connect-src cdnjs/cloudflareinsights/csp-worker: react-pdf Twemoji + CF beacon + CSP reports. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://cdnjs.cloudflare.com https://cloudflareinsights.com https://csp.cabinet-planner.workers.dev; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <style>
      #tiferet-bootstrap-shell {
        display: grid;

        place-items: center;
        padding: 2rem;

        width: 4.5rem;
        height: 4.5rem;
        margin-inline: auto;

        place-items: center;

        font-family: Georgia, serif;
        font-size: 2.45rem;
        line-height: 1;
      }

        color: #806d58;
        font-size: 0.72rem;

      .tiferet-bootstrap__title {

      .tiferet-bootstrap__line {

    </style>
